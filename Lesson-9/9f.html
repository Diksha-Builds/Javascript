<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input placeholder="Name" class = "js-input-text" 
    onkeydown=" 
        if(event.key === 'Enter')
        {
            inputMessage();
        }
    ">

    <button onclick="
        inputMessage();
    ">Submit</button>

    <p class = "js-message"></p>

    <script>
        function inputMessage()
        {
            const inputElement = document.querySelector('.js-input-text');
            document.querySelector('.js-message').innerHTML = `Your name is : ${inputElement.value}`;
        }
    </script>
</body>
</html>
