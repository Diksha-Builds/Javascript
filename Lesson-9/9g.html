<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
</head>
<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="
        subscribe();
    " class = "js-subscribe-button">Subscribe</button>

   
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>

    <!--
        When we press a key :

        1. Check if the key is "Enter"
        2. If it is, fo the same thing as Calculate button
    -->
    <input placeholder="Cost of order" class = "js-cost-input" 
        onkeydown="
        handleCostKeydown(event)">

    <!--
        When we click the button :

        1. Get the text in the text box
        2. if amount < $40, add $10
        3. Display total on the page
    -->
    <button onclick=" 
        calculateTotal();
    ">Calculate</button>

    <p class = "js-total-cost"></p>

    <script>
        /*
        String(25)
        console.log('25' - 5); // 20  // Automatic type conversion
        console.log('25' + 5); // 255 // Concatenation
        */

        function handleCostKeydown(event)
        {
            if(event.key === 'Enter')
            {
                calculateTotal();
            }
        }

        /*
            Issue = The calculation is inaccurate
            Solution = Calculate the number in cents and then 
            convert it back to dollars
        */
        function calculateTotal()
        {
            const inputElement = document.querySelector('.js-cost-input');

            // Convert the numbers to cents by 100
            let cost = Number(inputElement.value)*100;  // Converts string into number

            if(cost < 4000)
            {
                cost = cost + 1000;
            }

            // Convert back to dollars at the end
            document.querySelector('.js-total-cost').innerHTML = `$${cost/100}`;
        }

        function subscribe()
        {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if(buttonElement.innerText === 'Subscribe')
            {
                buttonElement.innerHTML = 'Subscribed';
            }
            else
            {
                buttonElement.innerHTML = 'Subscribe';
            }
        }
    </script>
</body>
</html>
